<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>授業変更・小テスト管理</title>

  <!-- PWA / Mobile Setup -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="授業変更">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📅</text></svg>">
  <link rel="manifest" id="manifest-placeholder">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: auto;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-24">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-calendar-check text-xl"></i>
        <h1 class="font-bold text-lg">授業変更・小テスト</h1>
      </div>
      <div class="flex items-center space-x-2">
        <!-- 表示切替ボタン -->
        <div class="bg-indigo-700/60 p-1 rounded-lg flex text-xs">
          <button id="viewListBtn" onclick="toggleView('list')" class="px-2.5 py-1 rounded-md bg-white text-indigo-700 font-bold shadow-sm transition">
            リスト
          </button>
          <button id="viewCalBtn" onclick="toggleView('calendar')" class="px-2.5 py-1 rounded-md text-indigo-100 font-medium transition">
            カレンダー
          </button>
        </div>
        <!-- 設定ボタン -->
        <button onclick="openSettings()" class="text-indigo-200 hover:text-white p-1">
          <i class="fa-solid fa-gear text-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- 絞り込みタブ -->
    <div class="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200 mb-4 text-xs font-bold text-slate-500">
      <button id="tab-all" onclick="setFilter('all')" class="flex-1 py-2 rounded-lg bg-indigo-50 text-indigo-600 transition">すべて</button>
      <button id="tab-quiz" onclick="setFilter('小テスト')" class="flex-1 py-2 rounded-lg hover:text-slate-800 transition">小テストのみ</button>
      <button id="tab-change" onclick="setFilter('授業変更')" class="flex-1 py-2 rounded-lg hover:text-slate-800 transition">授業変更のみ</button>
    </div>

    <!-- ステータス通知 -->
    <div id="statusBanner" class="hidden mb-4 p-2.5 text-xs rounded-xl flex justify-between items-center border">
      <span id="statusText">接続確認中...</span>
      <button onclick="initSupabase()" class="font-bold underline">再接続</button>
    </div>

    <!-- 1. リスト表示エリア -->
    <div id="listView" class="space-y-3">
      <div id="scheduleList" class="space-y-3"></div>
      <div id="emptyList" class="hidden py-12 text-center text-slate-400">
        <i class="fa-regular fa-calendar-xmark text-4xl mb-2"></i>
        <p class="text-xs">予定はありません</p>
      </div>
    </div>

    <!-- 2. カレンダー表示エリア -->
    <div id="calendarView" class="hidden bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <h2 id="calMonthTitle" class="font-bold text-sm text-slate-700"></h2>
        <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 mb-1">
        <span class="text-red-400">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-blue-400">土</span>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
    </div>

  </main>

  <!-- 追加ボタン (FAB) -->
  <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg flex items-center justify-center text-xl hover:bg-indigo-700 transition active:scale-95 z-30">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- 登録・編集モーダル -->
  <div id="formModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modalTitle" class="font-bold text-slate-800">予定を追加</h3>
        <button onclick="closeModal()" class="text-slate-400 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="scheduleForm" onsubmit="saveSchedule(event)" class="space-y-3">
        <input type="hidden" id="editId" value="">

        <!-- タイプ -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">タイプ</label>
          <div class="grid grid-cols-2 gap-2 text-xs font-bold">
            <label class="cursor-pointer">
              <input type="radio" name="formType" value="小テスト" checked onchange="toggleTypeUI()" class="peer sr-only">
              <div class="py-2 text-center rounded-xl border border-slate-200 peer-checked:bg-amber-50 peer-checked:border-amber-400 peer-checked:text-amber-700">📝 小テスト</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="formType" value="授業変更" onchange="toggleTypeUI()" class="peer sr-only">
              <div class="py-2 text-center rounded-xl border border-slate-200 peer-checked:bg-indigo-50 peer-checked:border-indigo-400 peer-checked:text-indigo-700">🔄 授業変更</div>
            </label>
          </div>
        </div>

        <!-- 日付 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">日付</label>
          <input type="date" id="formDate" required class="w-full px-3 py-2 border rounded-xl text-sm">
        </div>

        <!-- 小テスト用 教科選択 -->
        <div id="singleSubjectArea">
          <label class="block text-xs font-bold text-slate-600 mb-1">科目名</label>
          <select id="formSubject" class="w-full px-3 py-2 border rounded-xl text-sm bg-white"></select>
        </div>

        <!-- 授業変更用 教科選択 (変更前 -> 変更後) -->
        <div id="doubleSubjectArea" class="hidden">
          <label class="block text-xs font-bold text-slate-600 mb-1">教科の変更</label>
          <div class="flex items-center space-x-2">
            <div class="flex-1">
              <span class="text-[10px] text-slate-400 block">変更前</span>
              <select id="formSubjectFrom" class="w-full px-2 py-2 border rounded-xl text-xs bg-white"></select>
            </div>
            <i class="fa-solid fa-arrow-right text-slate-400 mt-3 text-xs"></i>
            <div class="flex-1">
              <span class="text-[10px] text-slate-400 block">変更後</span>
              <select id="formSubjectTo" class="w-full px-2 py-2 border rounded-xl text-xs bg-white"></select>
            </div>
          </div>
        </div>

        <!-- 内容 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">内容 / 範囲</label>
          <textarea id="formContent" rows="3" required placeholder="例: P.10〜15の単語テスト" class="w-full px-3 py-2 border rounded-xl text-sm"></textarea>
        </div>

        <!-- 登録者名 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">登録者名</label>
          <input type="text" id="formAuthor" required placeholder="例: 山田" class="w-full px-3 py-2 border rounded-xl text-sm">
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold text-sm rounded-xl shadow-md hover:bg-indigo-700 transition">
          保存する
        </button>
      </form>
    </div>
  </div>

  <!-- 設定モーダル (Supabase設定) -->
  <div id="settingsModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm">Supabase連携設定</h3>
        <button onclick="closeSettings()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Project URL</label>
        <input type="text" id="cfgUrl" class="w-full px-2.5 py-1.5 border rounded-lg text-xs font-mono">
      </div>
      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Anon Key</label>
        <input type="password" id="cfgKey" class="w-full px-2.5 py-1.5 border rounded-lg text-xs font-mono">
      </div>
      <button onclick="saveSettings()" class="w-full py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl">
        保存して再接続
      </button>
    </div>
  </div>

  <script>
    // 教科リスト
    const SUBJECTS = [
      '国語', '現代の国語', '言語文化', '論理国語',
      '数学I', '数学A', '数学II', '数学B', '数学III', '数学C',
      '英語', '英語コミュニケーション', '論理・表現',
      '物理', '化学', '生物', '地学',
      '歴史総合', '日本史', '世界史', '地理総合', '公共', '倫理', '政治・経済',
      '情報I', '保健体育', '音楽', '美術', '家庭科', 'その他'
    ];

    let SUPABASE_URL = localStorage.getItem('cfg_sp_url') || '';
    let SUPABASE_ANON_KEY = localStorage.getItem('cfg_sp_key') || '';
    let supabaseClient = null;

    let schedules = [];
    let activeFilter = 'all';
    let currentViewMode = 'list';
    let calDate = new Date();

    // PWA Manifest
    const manifest = {
      "name": "授業変更・小テスト",
      "short_name": "授業変更",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#f1f5f9",
      "theme_color": "#4f46e5",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📅</text></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    document.getElementById('manifest-placeholder').setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));

    window.addEventListener('DOMContentLoaded', () => {
      initDropdowns();
      initSupabase();
    });

    function initDropdowns() {
      const opts = SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join('');
      document.getElementById('formSubject').innerHTML = opts;
      document.getElementById('formSubjectFrom').innerHTML = opts;
      document.getElementById('formSubjectTo').innerHTML = opts;
    }

    function initSupabase() {
      const banner = document.getElementById('statusBanner');
      const text = document.getElementById('statusText');

      if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          banner.className = 'mb-4 p-2.5 text-xs rounded-xl flex justify-between items-center bg-emerald-50 text-emerald-800 border-emerald-200';
          text.innerHTML = '<i class="fa-solid fa-cloud-check mr-1 text-emerald-600"></i> Supabase接続完了';
          loadSchedules();
          return;
        } catch(e) { console.error(e); }
      }

      banner.className = 'mb-4 p-2.5 text-xs rounded-xl flex justify-between items-center bg-amber-50 text-amber-800 border-amber-200';
      text.innerHTML = '<i class="fa-solid fa-hard-drive mr-1 text-amber-600"></i> ローカルモード (Supabase未接続)';
      loadLocalSchedules();
    }

    async function loadSchedules() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('schedule_items')
          .select('*')
          .order('date', { ascending: true });
        if (error) throw error;
        schedules = data || [];
        render();
      } catch (err) {
        console.error(err);
        loadLocalSchedules();
      }
    }

    function loadLocalSchedules() {
      const local = localStorage.getItem('demo_data');
      if (local) {
        schedules = JSON.parse(local);
      } else {
        schedules = [
          { id: '1', date: getTodayStr(), type: '小テスト', subject: '英語コミュニケーション', content: '単語テスト Lesson 4', author: '係' },
          { id: '2', date: getTodayStr(), type: '授業変更', subject: '数学I → 物理', content: '体育館行事のため変更', author: '担任' }
        ];
        saveLocalSchedules();
      }
      render();
    }

    function saveLocalSchedules() {
      localStorage.setItem('demo_data', JSON.stringify(schedules));
    }

    // 保存・更新処理
    async function saveSchedule(e) {
      e.preventDefault();

      const editId = document.getElementById('editId').value;
      const type = document.querySelector('input[name="formType"]:checked').value;
      const date = document.getElementById('formDate').value;
      const content = document.getElementById('formContent').value.trim();
      const author = document.getElementById('formAuthor').value.trim();

      let subject = '';
      if (type === '小テスト') {
        subject = document.getElementById('formSubject').value;
      } else {
        const from = document.getElementById('formSubjectFrom').value;
        const to = document.getElementById('formSubjectTo').value;
        subject = `${from} → ${to}`;
      }

      const item = { date, type, subject, content, author };

      if (supabaseClient) {
        try {
          if (editId) {
            const { error } = await supabaseClient.from('schedule_items').update(item).eq('id', editId);
            if (error) throw error;
          } else {
            const { error } = await supabaseClient.from('schedule_items').insert([item]);
            if (error) throw error;
          }
          loadSchedules();
        } catch (err) {
          alert('保存できませんでした: ' + err.message);
        }
      } else {
        if (editId) {
          schedules = schedules.map(s => s.id === editId ? { ...s, ...item } : s);
        } else {
          item.id = Date.now().toString();
          schedules.push(item);
        }
        saveLocalSchedules();
        render();
      }

      closeModal();
    }

    // 削除
    async function deleteItem(id) {
      if (!confirm('本当に削除しますか？')) return;

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.from('schedule_items').delete().eq('id', id);
          if (error) throw error;
          loadSchedules();
        } catch (err) {
          alert('削除できませんでした: ' + err.message);
        }
      } else {
        schedules = schedules.filter(s => s.id !== id);
        saveLocalSchedules();
        render();
      }
    }

    // 編集モーダル開く
    function openEditModal(id) {
      const item = schedules.find(s => s.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('modalTitle').textContent = '予定を編集';
      document.getElementById('formDate').value = item.date;
      document.getElementById('formContent').value = item.content;
      document.getElementById('formAuthor').value = item.author;

      const radios = document.getElementsByName('formType');
      for (let r of radios) r.checked = (r.value === item.type);
      toggleTypeUI();

      if (item.type === '小テスト') {
        document.getElementById('formSubject').value = item.subject;
      } else if (item.subject.includes('→')) {
        const parts = item.subject.split('→').map(s => s.trim());
        document.getElementById('formSubjectFrom').value = parts[0] || SUBJECTS[0];
        document.getElementById('formSubjectTo').value = parts[1] || SUBJECTS[0];
      }

      document.getElementById('formModal').classList.remove('hidden');
    }

    // レンダリング統合
    function render() {
      renderList();
      renderCalendar();
    }

    // リスト描画
    function renderList() {
      const listEl = document.getElementById('scheduleList');
      const emptyEl = document.getElementById('emptyList');
      listEl.innerHTML = '';

      let list = schedules;
      if (activeFilter !== 'all') {
        list = schedules.filter(s => s.type === activeFilter);
      }

      list.sort((a, b) => new Date(a.date) - new Date(b.date));

      if (list.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      list.forEach(item => {
        const isQuiz = item.type === '小テスト';
        const badgeStyle = isQuiz ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-800';

        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2">
              <span class="px-2 py-0.5 text-xs font-bold rounded-md ${badgeStyle}">
                ${isQuiz ? '📝' : '🔄'} ${item.type}
              </span>
              <span class="text-xs font-bold text-slate-500">${formatDate(item.date)}</span>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="openEditModal('${item.id}')" class="text-slate-400 hover:text-indigo-600 text-xs">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-red-500 text-xs">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </div>
          <h3 class="font-bold text-slate-800 text-sm">${escapeHtml(item.subject)}</h3>
          <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-xl whitespace-pre-wrap">${escapeHtml(item.content)}</p>
          <div class="text-right text-[10px] text-slate-400">登録: ${escapeHtml(item.author)}</div>
        `;
        listEl.appendChild(card);
      });
    }

    // カレンダー描画
    function renderCalendar() {
      const year = calDate.getFullYear();
      const month = calDate.getMonth();

      document.getElementById('calMonthTitle').textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevTotalDays = new Date(year, month, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const todayStr = getTodayStr();

      // 前月補填
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = prevTotalDays - i;
        grid.appendChild(createCalCell(d, true));
      }

      // 当月
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        let items = schedules.filter(s => s.date === dateStr);
        if (activeFilter !== 'all') items = items.filter(s => s.type === activeFilter);

        grid.appendChild(createCalCell(day, false, dateStr === todayStr, items, dateStr));
      }

      // 翌月補填
      const pad = 35 - grid.children.length;
      for (let i = 1; i <= pad; i++) {
        grid.appendChild(createCalCell(i, true));
      }
    }

    function createCalCell(day, isOther, isToday = false, items = [], dateStr = '') {
      const cell = document.createElement('div');
      cell.className = `min-h-[56px] p-1 border rounded-xl flex flex-col justify-between text-xs ${
        isOther ? 'bg-slate-50 text-slate-300 border-slate-100' : 'bg-white text-slate-700 border-slate-200 cursor-pointer hover:border-indigo-300'
      } ${isToday ? 'ring-2 ring-indigo-500 bg-indigo-50/20' : ''}`;

      if (!isOther) {
        cell.onclick = () => openModal(dateStr);
      }

      let badgeHtml = '';
      if (items.length > 0) {
        badgeHtml = '<div class="space-y-0.5 mt-0.5">';
        items.slice(0, 2).forEach(it => {
          const bg = it.type === '小テスト' ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-800';
          badgeHtml += `<div class="text-[8px] px-1 py-0.5 rounded font-bold truncate ${bg}">${escapeHtml(it.subject)}</div>`;
        });
        if (items.length > 2) badgeHtml += `<div class="text-[8px] text-slate-400 text-center">+${items.length - 2}</div>`;
        badgeHtml += '</div>';
      }

      cell.innerHTML = `
        <div class="font-bold ${isToday ? 'text-indigo-600' : ''}">${day}</div>
        ${badgeHtml}
      `;
      return cell;
    }

    function changeMonth(dir) {
      calDate.setMonth(calDate.getMonth() + dir);
      renderCalendar();
    }

    // 表示モード切替
    function toggleView(mode) {
      currentViewMode = mode;
      const listBtn = document.getElementById('viewListBtn');
      const calBtn = document.getElementById('viewCalBtn');
      const listView = document.getElementById('listView');
      const calView = document.getElementById('calendarView');

      if (mode === 'list') {
        listBtn.className = 'px-2.5 py-1 rounded-md bg-white text-indigo-700 font-bold shadow-sm transition';
        calBtn.className = 'px-2.5 py-1 rounded-md text-indigo-100 font-medium transition';
        listView.classList.remove('hidden');
        calView.classList.add('hidden');
      } else {
        calBtn.className = 'px-2.5 py-1 rounded-md bg-white text-indigo-700 font-bold shadow-sm transition';
        listBtn.className = 'px-2.5 py-1 rounded-md text-indigo-100 font-medium transition';
        calView.classList.remove('hidden');
        listView.classList.add('hidden');
        renderCalendar();
      }
    }

    // フィルター選択
    function setFilter(filter) {
      activeFilter = filter;
      ['all', 'quiz', 'change'].forEach(key => {
        const btn = document.getElementById('tab-' + key);
        const match = (key === 'all' && filter === 'all') || 
                      (key === 'quiz' && filter === '小テスト') || 
                      (key === 'change' && filter === '授業変更');
        if (match) {
          btn.className = 'flex-1 py-2 rounded-lg bg-indigo-50 text-indigo-600 transition';
        } else {
          btn.className = 'flex-1 py-2 rounded-lg hover:text-slate-800 transition';
        }
      });
      render();
    }

    function toggleTypeUI() {
      const type = document.querySelector('input[name="formType"]:checked').value;
      if (type === '小テスト') {
        document.getElementById('singleSubjectArea').classList.remove('hidden');
        document.getElementById('doubleSubjectArea').classList.add('hidden');
      } else {
        document.getElementById('singleSubjectArea').classList.add('hidden');
        document.getElementById('doubleSubjectArea').classList.remove('hidden');
      }
    }

    // モーダル関連
    function openModal(presetDate = '') {
      document.getElementById('editId').value = '';
      document.getElementById('modalTitle').textContent = '予定を追加';
      document.getElementById('scheduleForm').reset();
      document.getElementById('formDate').value = presetDate || getTodayStr();
      toggleTypeUI();
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    function openSettings() {
      document.getElementById('cfgUrl').value = SUPABASE_URL;
      document.getElementById('cfgKey').value = SUPABASE_ANON_KEY;
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      const u = document.getElementById('cfgUrl').value.trim();
      const k = document.getElementById('cfgKey').value.trim();
      localStorage.setItem('cfg_sp_url', u);
      localStorage.setItem('cfg_sp_key', k);
      SUPABASE_URL = u;
      SUPABASE_ANON_KEY = k;
      closeSettings();
      initSupabase();
    }

    // ユーティリティ
    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDate(str) {
      if (!str) return '';
      const [y, m, d] = str.split('-');
      const date = new Date(y, m - 1, d);
      const dayStr = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
      return `${parseInt(m)}/${parseInt(d)}(${dayStr})`;
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
</html>
