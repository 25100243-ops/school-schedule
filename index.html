<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>授業変更・小テスト・提出物管理</title>

  <!-- PWA / Mobile Setup -->
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="授業変更">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23115e59'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📅</text></svg>">
  <link rel="manifest" id="manifest-placeholder">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tealbrand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: auto;
    }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-24 md:pb-12">

  <!-- ヘッダー -->
  <header class="bg-tealbrand-800 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <i class="fa-solid fa-calendar-check text-xl text-teal-200"></i>
        <h1 class="font-bold text-base md:text-lg tracking-wide">授業変更・小テスト・提出物</h1>
      </div>
      <div class="flex items-center space-x-2">
        <!-- 表示切替ボタン -->
        <div class="bg-tealbrand-900/60 p-1 rounded-lg flex text-xs">
          <button id="viewListBtn" onclick="toggleView('list')" class="px-3 py-1.5 rounded-md bg-white text-tealbrand-800 font-bold shadow-sm transition">
            <i class="fa-solid fa-list mr-1"></i>リスト
          </button>
          <button id="viewCalBtn" onclick="toggleView('calendar')" class="px-3 py-1.5 rounded-md text-teal-100 font-medium transition hover:text-white">
            <i class="fa-regular fa-calendar-days mr-1"></i>カレンダー
          </button>
        </div>
        <!-- 設定ボタン -->
        <button onclick="openSettings()" class="text-teal-200 hover:text-white p-1.5 rounded-lg hover:bg-tealbrand-700/50 transition">
          <i class="fa-solid fa-gear text-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-4">

    <!-- 絞り込みタブ -->
    <div class="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200 mb-4 text-xs font-bold text-slate-500 overflow-x-auto">
      <button id="tab-all" onclick="setFilter('all')" class="flex-1 min-w-[70px] py-2 rounded-lg bg-teal-50 text-tealbrand-800 transition">すべて</button>
      <button id="tab-quiz" onclick="setFilter('小テスト')" class="flex-1 min-w-[80px] py-2 rounded-lg hover:text-slate-800 transition">小テスト</button>
      <button id="tab-change" onclick="setFilter('授業変更')" class="flex-1 min-w-[80px] py-2 rounded-lg hover:text-slate-800 transition">授業変更</button>
      <button id="tab-submit" onclick="setFilter('提出物')" class="flex-1 min-w-[80px] py-2 rounded-lg hover:text-slate-800 transition">提出物</button>
    </div>

    <!-- ステータス通知バー -->
    <div id="statusBanner" class="hidden mb-4 p-2.5 text-xs rounded-xl flex justify-between items-center border shadow-xs">
      <span id="statusText">接続確認中...</span>
      <button onclick="initSupabase()" class="font-bold underline ml-2">再接続</button>
    </div>

    <!-- 1. リスト表示エリア -->
    <div id="listView" class="space-y-3">
      <div id="scheduleList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      <div id="emptyList" class="hidden py-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-200/80 shadow-xs">
        <i class="fa-regular fa-calendar-xmark text-4xl mb-2 text-slate-300"></i>
        <p class="text-xs font-medium">該当する予定はありません</p>
      </div>
    </div>

    <!-- 2. カレンダー表示エリア -->
    <div id="calendarView" class="hidden bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <h2 id="calMonthTitle" class="font-bold text-sm md:text-base text-slate-700"></h2>
        <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center transition">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 mb-1">
        <span class="text-rose-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-sky-500">土</span>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 md:gap-2"></div>
    </div>

  </main>

  <!-- 追加ボタン (FAB) -->
  <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-tealbrand-800 text-white rounded-full shadow-lg flex items-center justify-center text-xl hover:bg-tealbrand-700 transition active:scale-95 z-30">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- 日別予定モーダル（カレンダーの日付タップ時） -->
  <div id="dayDetailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4 transition-opacity">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-xl space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3 flex-shrink-0">
        <div class="flex items-center space-x-2">
          <span id="dayDetailBadge" class="w-2.5 h-2.5 rounded-full bg-tealbrand-800"></span>
          <h3 id="dayDetailTitle" class="font-bold text-slate-800 text-sm md:text-base">月日の予定</h3>
        </div>
        <button onclick="closeDayDetailModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
      </div>

      <div id="dayDetailContent" class="space-y-2.5 overflow-y-auto flex-grow pr-1"></div>

      <div class="pt-2 border-t border-slate-100 flex-shrink-0">
        <button id="dayDetailAddBtn" onclick="" class="w-full py-2.5 bg-tealbrand-800 text-white font-bold text-xs md:text-sm rounded-xl shadow-xs hover:bg-tealbrand-700 transition flex items-center justify-center space-x-1">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>この日に予定を追加</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 登録・編集モーダル -->
  <div id="formModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-sm md:text-base">予定を追加</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="scheduleForm" onsubmit="saveSchedule(event)" class="space-y-3.5">
        <input type="hidden" id="editId" value="">

        <!-- タイプ選択 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">タイプ</label>
          <div class="grid grid-cols-3 gap-2 text-xs font-bold">
            <label class="cursor-pointer">
              <input type="radio" name="formType" value="小テスト" checked onchange="toggleTypeUI()" class="peer sr-only">
              <div class="py-2.5 text-center rounded-xl border border-slate-200 peer-checked:bg-amber-50 peer-checked:border-amber-400 peer-checked:text-amber-800 transition">📝 小テスト</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="formType" value="授業変更" onchange="toggleTypeUI()" class="peer sr-only">
              <div class="py-2.5 text-center rounded-xl border border-slate-200 peer-checked:bg-slate-100 peer-checked:border-slate-400 peer-checked:text-slate-800 transition">🔄 授業変更</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="formType" value="提出物" onchange="toggleTypeUI()" class="peer sr-only">
              <div class="py-2.5 text-center rounded-xl border border-slate-200 peer-checked:bg-rose-50 peer-checked:border-rose-300 peer-checked:text-rose-800 transition">📤 提出物</div>
            </label>
          </div>
        </div>

        <!-- 日付 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">日付</label>
          <input type="date" id="formDate" required class="w-full px-3 py-2 border rounded-xl text-xs md:text-sm border-slate-300 focus:ring-2 focus:ring-tealbrand-500 focus:outline-none">
        </div>

        <!-- 小テスト/提出物用 教科選択 -->
        <div id="singleSubjectArea">
          <label class="block text-xs font-bold text-slate-600 mb-1">科目名</label>
          <select id="formSubject" class="w-full px-3 py-2 border rounded-xl text-xs md:text-sm bg-white border-slate-300 focus:ring-2 focus:ring-tealbrand-500 focus:outline-none"></select>
        </div>

        <!-- 授業変更用 教科選択 (変更前 -> 変更後) -->
        <div id="doubleSubjectArea" class="hidden">
          <label class="block text-xs font-bold text-slate-600 mb-1">教科の変更</label>
          <div class="flex items-center space-x-2">
            <div class="flex-1">
              <span class="text-[10px] text-slate-400 block mb-0.5">変更前</span>
              <select id="formSubjectFrom" class="w-full px-2 py-2 border rounded-xl text-xs bg-white border-slate-300 focus:ring-2 focus:ring-tealbrand-500 focus:outline-none"></select>
            </div>
            <i class="fa-solid fa-arrow-right text-slate-400 mt-3 text-xs"></i>
            <div class="flex-1">
              <span class="text-[10px] text-slate-400 block mb-0.5">変更後</span>
              <select id="formSubjectTo" class="w-full px-2 py-2 border rounded-xl text-xs bg-white border-slate-300 focus:ring-2 focus:ring-tealbrand-500 focus:outline-none"></select>
            </div>
          </div>
        </div>

        <!-- 内容 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">内容 / 範囲</label>
          <textarea id="formContent" rows="3" required placeholder="例: 単語ワーク P.10〜15" class="w-full px-3 py-2 border rounded-xl text-xs md:text-sm border-slate-300 focus:ring-2 focus:ring-tealbrand-500 focus:outline-none"></textarea>
        </div>

        <!-- 登録者名 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">登録者名</label>
          <input type="text" id="formAuthor" required placeholder="例: 山田" class="w-full px-3 py-2 border rounded-xl text-xs md:text-sm border-slate-300 focus:ring-2 focus:ring-tealbrand-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full py-3 bg-tealbrand-800 text-white font-bold text-xs md:text-sm rounded-xl shadow-md hover:bg-tealbrand-700 transition">
          保存する
        </button>
      </form>
    </div>
  </div>

  <!-- 設定モーダル (Supabase設定 & 教科管理) -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">
        <h3 class="font-bold text-slate-800 text-sm">設定</h3>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- 1. 教科管理セクション (順序変更機能付き) -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <label class="block text-xs font-bold text-slate-700">📚 教科の管理と並び替え</label>
          <span class="text-[10px] text-slate-400">▲▼で順序変更</span>
        </div>
        <div id="subjectTagList" class="space-y-1.5 max-h-52 overflow-y-auto p-1.5 bg-slate-50 border border-slate-200 rounded-xl">
          <!-- JSで動的にタグ生成 -->
        </div>
        <div class="flex space-x-1.5 pt-1">
          <input type="text" id="newSubjectInput" placeholder="新しい教科名" class="flex-1 px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-tealbrand-500 focus:outline-none">
          <button type="button" onclick="addSubject()" class="px-3 py-1.5 bg-slate-800 text-white font-bold text-xs rounded-lg hover:bg-slate-700 transition">
            追加
          </button>
        </div>
      </div>

      <hr class="border-slate-100">

      <!-- 2. Supabase設定セクション -->
      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-700">⚡ Supabase連携設定</label>
        <div>
          <label class="block text-[10px] text-slate-500 mb-0.5">Project URL</label>
          <input type="text" id="cfgUrl" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs font-mono">
        </div>
        <div>
          <label class="block text-[10px] text-slate-500 mb-0.5">Anon Key</label>
          <input type="password" id="cfgKey" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs font-mono">
        </div>
      </div>

      <button onclick="saveSettings()" class="w-full py-2.5 bg-tealbrand-800 text-white font-bold text-xs rounded-xl hover:bg-tealbrand-700 transition">
        保存して閉じる
      </button>
    </div>
  </div>

  <!-- 共通削除確認ダイアログ -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl text-center space-y-3">
      <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-lg">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h4 class="font-bold text-slate-800 text-sm">予定を削除しますか？</h4>
      <p class="text-xs text-slate-500">この操作は取り消せません。</p>
      <div class="flex space-x-2 pt-1">
        <button onclick="closeConfirmModal()" class="flex-1 py-2 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl hover:bg-slate-200 transition">キャンセル</button>
        <button id="confirmDeleteBtn" onclick="" class="flex-1 py-2 bg-rose-600 text-white font-bold text-xs rounded-xl hover:bg-rose-700 transition">削除する</button>
      </div>
    </div>
  </div>

  <!-- トースト通知コンテナ -->
  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    // 指定されたデフォルト教科リスト
    const DEFAULT_SUBJECTS = [
      '論理国語', '古典探究', '数学', '英コミュ', '論理表現', 
      '物理', '生物', '化学', '公共', '情報II', '家庭科', '保健', '体育'
    ];

    // 教科リスト（LocalStorage）
    let subjects = JSON.parse(localStorage.getItem('cfg_subjects')) || DEFAULT_SUBJECTS;

    let SUPABASE_URL = localStorage.getItem('cfg_sp_url') || '';
    let SUPABASE_ANON_KEY = localStorage.getItem('cfg_sp_key') || '';
    let supabaseClient = null;

    let schedules = [];
    let activeFilter = 'all';
    let currentViewMode = 'list';
    let calDate = new Date();
    let pendingDeleteId = null;

    // PWA Manifest 動的生成
    const manifest = {
      "name": "授業変更・小テスト・提出物",
      "short_name": "授業変更",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#f8fafc",
      "theme_color": "#115e59",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23115e59'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📅</text></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    document.getElementById('manifest-placeholder').setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));

    window.addEventListener('DOMContentLoaded', () => {
      initDropdowns();
      initSupabase();
    });

    // ドロップダウン更新
    function initDropdowns() {
      const opts = subjects.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      document.getElementById('formSubject').innerHTML = opts;
      document.getElementById('formSubjectFrom').innerHTML = opts;
      document.getElementById('formSubjectTo').innerHTML = opts;
    }

    // --- 教科の並び替え & 管理 ---
    function renderSubjectManager() {
      const container = document.getElementById('subjectTagList');
      container.innerHTML = '';

      subjects.forEach((sub, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2 bg-white border border-slate-200 rounded-lg text-xs';
        item.innerHTML = `
          <span class="font-medium text-slate-700 truncate max-w-[140px]">${escapeHtml(sub)}</span>
          <div class="flex items-center space-x-1">
            <button type="button" onclick="moveSubject(${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-30 text-slate-400 p-1"' : 'class="text-slate-600 hover:text-tealbrand-800 p-1"'}>
              <i class="fa-solid fa-arrow-up text-[10px]"></i>
            </button>
            <button type="button" onclick="moveSubject(${idx}, 1)" ${idx === subjects.length - 1 ? 'disabled class="opacity-30 text-slate-400 p-1"' : 'class="text-slate-600 hover:text-tealbrand-800 p-1"'}>
              <i class="fa-solid fa-arrow-down text-[10px]"></i>
            </button>
            <button type="button" onclick="removeSubject(${idx})" class="text-slate-400 hover:text-rose-500 p-1 ml-1">
              <i class="fa-solid fa-xmark text-xs"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function moveSubject(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= subjects.length) return;
      
      const temp = subjects[index];
      subjects[index] = subjects[targetIndex];
      subjects[targetIndex] = temp;

      localStorage.setItem('cfg_subjects', JSON.stringify(subjects));
      renderSubjectManager();
      initDropdowns();
    }

    function addSubject() {
      const input = document.getElementById('newSubjectInput');
      const name = input.value.trim();
      if (!name) return;

      if (subjects.includes(name)) {
        showToast('その教科は既に追加されています', 'warning');
        return;
      }

      subjects.push(name);
      localStorage.setItem('cfg_subjects', JSON.stringify(subjects));
      input.value = '';
      
      renderSubjectManager();
      initDropdowns();
      showToast('教科を追加しました');
    }

    function removeSubject(index) {
      if (subjects.length <= 1) {
        showToast('教科は最低1つ必要です', 'warning');
        return;
      }
      subjects.splice(index, 1);
      localStorage.setItem('cfg_subjects', JSON.stringify(subjects));
      
      renderSubjectManager();
      initDropdowns();
      showToast('教科を削除しました');
    }

    // --- Supabase 連携 ---
    function initSupabase() {
      const banner = document.getElementById('statusBanner');
      const text = document.getElementById('statusText');

      if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          banner.className = 'mb-4 p-2.5 text-xs rounded-xl flex justify-between items-center bg-emerald-50 text-emerald-800 border-emerald-200 shadow-xs';
          text.innerHTML = '<i class="fa-solid fa-cloud-check mr-1.5 text-emerald-600"></i> Supabase クラウド同期中';
          loadSchedules();
          return;
        } catch(e) { console.error(e); }
      }

      banner.className = 'mb-4 p-2.5 text-xs rounded-xl flex justify-between items-center bg-slate-100 text-slate-700 border-slate-200 shadow-xs';
      text.innerHTML = '<i class="fa-solid fa-hard-drive mr-1.5 text-slate-500"></i> ローカル保存モード';
      loadLocalSchedules();
    }

    async function loadSchedules() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('schedule_items')
          .select('*')
          .order('date', { ascending: true });
        if (error) throw error;
        schedules = data || [];
        render();
      } catch (err) {
        console.error(err);
        showToast('クラウドデータの取得に失敗しました', 'warning');
        loadLocalSchedules();
      }
    }

    function loadLocalSchedules() {
      const local = localStorage.getItem('demo_data');
      if (local) {
        schedules = JSON.parse(local);
      } else {
        schedules = [
          { id: '1', date: getTodayStr(), type: '小テスト', subject: '英コミュ', content: '単語テスト Unit 4', author: '係' },
          { id: '2', date: getTodayStr(), type: '授業変更', subject: '数学 → 物理', content: '小アリーナ移動のため変更', author: '担任' },
          { id: '3', date: getTodayStr(), type: '提出物', subject: '論理国語', content: 'ワーク P.20-25 提出期限', author: '教科担当' }
        ];
        saveLocalSchedules();
      }
      render();
    }

    function saveLocalSchedules() {
      localStorage.setItem('demo_data', JSON.stringify(schedules));
    }

    // 保存処理 (小テスト/授業変更/提出物)
    async function saveSchedule(e) {
      e.preventDefault();

      const editId = document.getElementById('editId').value;
      const type = document.querySelector('input[name="formType"]:checked').value;
      const date = document.getElementById('formDate').value;
      const content = document.getElementById('formContent').value.trim();
      const author = document.getElementById('formAuthor').value.trim();

      let subject = '';
      if (type === '授業変更') {
        const from = document.getElementById('formSubjectFrom').value;
        const to = document.getElementById('formSubjectTo').value;
        subject = `${from} → ${to}`;
      } else {
        subject = document.getElementById('formSubject').value;
      }

      const item = { date, type, subject, content, author };

      if (supabaseClient) {
        try {
          if (editId) {
            const { error } = await supabaseClient.from('schedule_items').update(item).eq('id', editId);
            if (error) throw error;
          } else {
            const { error } = await supabaseClient.from('schedule_items').insert([item]);
            if (error) throw error;
          }
          showToast('保存しました');
          loadSchedules();
        } catch (err) {
          console.error(err);
          let msg = err.message || '';
          if (msg.includes('schedule_items_type_check') || msg.includes('check constraint')) {
            msg = 'SupabaseのDB制限エラーです。SQLエディタでtype制約を更新してください。';
          }
          showToast('保存エラー: ' + msg, 'error');
        }
      } else {
        if (editId) {
          schedules = schedules.map(s => s.id === editId ? { ...s, ...item } : s);
        } else {
          item.id = Date.now().toString();
          schedules.push(item);
        }
        saveLocalSchedules();
        showToast('保存しました');
        render();
      }

      closeModal();
      closeDayDetailModal();
    }

    // 削除処理
    function askDeleteItem(id) {
      pendingDeleteId = id;
      document.getElementById('confirmDeleteBtn').onclick = () => executeDelete();
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      pendingDeleteId = null;
      document.getElementById('confirmModal').classList.add('hidden');
    }

    async function executeDelete() {
      if (!pendingDeleteId) return;
      const id = pendingDeleteId;
      closeConfirmModal();

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.from('schedule_items').delete().eq('id', id);
          if (error) throw error;
          showToast('削除しました');
          loadSchedules();
        } catch (err) {
          showToast('削除エラー: ' + err.message, 'error');
        }
      } else {
        schedules = schedules.filter(s => s.id !== id);
        saveLocalSchedules();
        showToast('削除しました');
        render();
      }

      closeDayDetailModal();
    }

    // 編集モーダル開く
    function openEditModal(id) {
      const item = schedules.find(s => s.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('modalTitle').textContent = '予定を編集';
      document.getElementById('formDate').value = item.date;
      document.getElementById('formContent').value = item.content;
      document.getElementById('formAuthor').value = item.author;

      const radios = document.getElementsByName('formType');
      for (let r of radios) r.checked = (r.value === item.type);
      toggleTypeUI();

      if (item.type === '授業変更') {
        if (item.subject.includes('→')) {
          const parts = item.subject.split('→').map(s => s.trim());
          document.getElementById('formSubjectFrom').value = parts[0] || subjects[0];
          document.getElementById('formSubjectTo').value = parts[1] || subjects[0];
        }
      } else {
        document.getElementById('formSubject').value = item.subject;
      }

      closeDayDetailModal();
      document.getElementById('formModal').classList.remove('hidden');
    }

    // レンダリング統合
    function render() {
      renderList();
      renderCalendar();
    }

    // リスト描画（内部ロジックで「今日以降」のみ絞り込み、UIデザインはそのまま維持）
    function renderList() {
      const listEl = document.getElementById('scheduleList');
      const emptyEl = document.getElementById('emptyList');
      listEl.innerHTML = '';

      let list = schedules;

      // 1. タイプフィルター
      if (activeFilter !== 'all') {
        list = list.filter(s => s.type === activeFilter);
      }

      // 2. 日付フィルター（UIを変えずに「今日以降」のみ表示）
      const today = getTodayStr();
      list = list.filter(s => s.date >= today);

      list.sort((a, b) => new Date(a.date) - new Date(b.date));

      if (list.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      list.forEach(item => {
        const badgeStyle = getBadgeStyle(item.type);

        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 space-y-2.5 transition hover:border-slate-300';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2">
              <span class="px-2.5 py-1 text-[11px] font-bold rounded-lg ${badgeStyle}">
                ${getTypeIcon(item.type)} ${escapeHtml(item.type)}
              </span>
              <span class="text-xs font-bold text-slate-500">${formatDate(item.date)}</span>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="openEditModal('${item.id}')" class="text-slate-400 hover:text-tealbrand-800 text-xs p-1">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="askDeleteItem('${item.id}')" class="text-slate-400 hover:text-rose-500 text-xs p-1">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </div>
          <h3 class="font-bold text-slate-800 text-sm md:text-base">${escapeHtml(item.subject)}</h3>
          <p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl whitespace-pre-wrap leading-relaxed">${escapeHtml(item.content)}</p>
          <div class="text-right text-[10px] text-slate-400">登録: ${escapeHtml(item.author)}</div>
        `;
        listEl.appendChild(card);
      });
    }

    // カレンダー描画
    function renderCalendar() {
      const year = calDate.getFullYear();
      const month = calDate.getMonth();

      document.getElementById('calMonthTitle').textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevTotalDays = new Date(year, month, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const todayStr = getTodayStr();

      // 前月補填
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = prevTotalDays - i;
        grid.appendChild(createCalCell(d, true));
      }

      // 当月
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        let items = schedules.filter(s => s.date === dateStr);
        if (activeFilter !== 'all') items = items.filter(s => s.type === activeFilter);

        grid.appendChild(createCalCell(day, false, dateStr === todayStr, items, dateStr));
      }

      // 翌月補填
      const pad = 35 - grid.children.length;
      for (let i = 1; i <= pad; i++) {
        grid.appendChild(createCalCell(i, true));
      }
    }

    function createCalCell(day, isOther, isToday = false, items = [], dateStr = '') {
      const cell = document.createElement('div');
      cell.className = `min-h-[64px] md:min-h-[80px] p-1.5 border rounded-xl flex flex-col justify-between text-xs transition ${
        isOther ? 'bg-slate-50/50 text-slate-300 border-slate-100' : 'bg-white text-slate-700 border-slate-200/90 cursor-pointer hover:border-tealbrand-500 hover:shadow-xs'
      } ${isToday ? 'ring-2 ring-tealbrand-700 bg-teal-50/30 font-bold' : ''}`;

      if (!isOther) {
        cell.onclick = () => openDayDetailModal(dateStr, items);
      }

      let badgeHtml = '';
      if (items.length > 0) {
        badgeHtml = '<div class="space-y-1 mt-1 overflow-hidden">';
        items.slice(0, 2).forEach(it => {
          const badgeStyle = getBadgeStyle(it.type);
          badgeHtml += `<div class="text-[9px] px-1 py-0.5 rounded font-bold truncate ${badgeStyle}">${escapeHtml(it.subject)}</div>`;
        });
        if (items.length > 2) badgeHtml += `<div class="text-[9px] text-slate-400 text-center font-bold">+${items.length - 2}件</div>`;
        badgeHtml += '</div>';
      }

      cell.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="${isToday ? 'text-tealbrand-800 font-black' : ''}">${day}</span>
          ${items.length > 0 ? `<span class="w-1.5 h-1.5 rounded-full bg-tealbrand-700"></span>` : ''}
        </div>
        ${badgeHtml}
      `;
      return cell;
    }

    // カレンダー日付選択モーダル（日別一覧）
    function openDayDetailModal(dateStr, items = null) {
      if (!items) {
        items = schedules.filter(s => s.date === dateStr);
        if (activeFilter !== 'all') items = items.filter(s => s.type === activeFilter);
      }

      document.getElementById('dayDetailTitle').textContent = `${formatDate(dateStr)} の予定 (${items.length}件)`;
      document.getElementById('dayDetailAddBtn').onclick = () => {
        closeDayDetailModal();
        openModal(dateStr);
      };

      const container = document.getElementById('dayDetailContent');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = `
          <div class="py-8 text-center text-slate-400">
            <i class="fa-regular fa-calendar-check text-3xl mb-1 text-slate-300"></i>
            <p class="text-xs">予定はありません</p>
          </div>
        `;
      } else {
        items.forEach(item => {
          const badgeStyle = getBadgeStyle(item.type);
          const card = document.createElement('div');
          card.className = 'bg-slate-50 rounded-xl p-3 border border-slate-200/80 space-y-1.5 text-xs';
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="px-2 py-0.5 text-[10px] font-bold rounded ${badgeStyle}">
                ${getTypeIcon(item.type)} ${escapeHtml(item.type)}
              </span>
              <div class="flex items-center space-x-2">
                <button onclick="openEditModal('${item.id}')" class="text-slate-400 hover:text-tealbrand-800 p-0.5">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="askDeleteItem('${item.id}')" class="text-slate-400 hover:text-rose-500 p-0.5">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </div>
            <h4 class="font-bold text-slate-800 text-sm">${escapeHtml(item.subject)}</h4>
            <p class="text-slate-600 bg-white p-2 rounded-lg border border-slate-100 whitespace-pre-wrap">${escapeHtml(item.content)}</p>
            <div class="text-right text-[10px] text-slate-400">登録: ${escapeHtml(item.author)}</div>
          `;
          container.appendChild(card);
        });
      }

      document.getElementById('dayDetailModal').classList.remove('hidden');
    }

    function closeDayDetailModal() {
      document.getElementById('dayDetailModal').classList.add('hidden');
    }

    function changeMonth(dir) {
      calDate.setMonth(calDate.getMonth() + dir);
      renderCalendar();
    }

    // 表示モード切替
    function toggleView(mode) {
      currentViewMode = mode;
      const listBtn = document.getElementById('viewListBtn');
      const calBtn = document.getElementById('viewCalBtn');
      const listView = document.getElementById('listView');
      const calView = document.getElementById('calendarView');

      if (mode === 'list') {
        listBtn.className = 'px-3 py-1.5 rounded-md bg-white text-tealbrand-800 font-bold shadow-sm transition';
        calBtn.className = 'px-3 py-1.5 rounded-md text-teal-100 font-medium transition hover:text-white';
        listView.classList.remove('hidden');
        calView.classList.add('hidden');
      } else {
        calBtn.className = 'px-3 py-1.5 rounded-md bg-white text-tealbrand-800 font-bold shadow-sm transition';
        listBtn.className = 'px-3 py-1.5 rounded-md text-teal-100 font-medium transition hover:text-white';
        calView.classList.remove('hidden');
        listView.classList.add('hidden');
        renderCalendar();
      }
    }

    // フィルター選択
    function setFilter(filter) {
      activeFilter = filter;
      const tabs = { 'all': 'all', 'quiz': '小テスト', 'change': '授業変更', 'submit': '提出物' };
      
      Object.keys(tabs).forEach(key => {
        const btn = document.getElementById('tab-' + key);
        if (tabs[key] === filter) {
          btn.className = 'flex-1 min-w-[70px] py-2 rounded-lg bg-teal-50 text-tealbrand-800 font-bold transition shadow-2xs';
        } else {
          btn.className = 'flex-1 min-w-[70px] py-2 rounded-lg hover:text-slate-800 transition';
        }
      });
      render();
    }

    function toggleTypeUI() {
      const type = document.querySelector('input[name="formType"]:checked').value;
      if (type === '授業変更') {
        document.getElementById('singleSubjectArea').classList.add('hidden');
        document.getElementById('doubleSubjectArea').classList.remove('hidden');
      } else {
        document.getElementById('singleSubjectArea').classList.remove('hidden');
        document.getElementById('doubleSubjectArea').classList.add('hidden');
      }
    }

    // モーダル操作
    function openModal(presetDate = '') {
      document.getElementById('editId').value = '';
      document.getElementById('modalTitle').textContent = '予定を追加';
      document.getElementById('scheduleForm').reset();
      document.getElementById('formDate').value = presetDate || getTodayStr();
      toggleTypeUI();
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    function openSettings() {
      document.getElementById('cfgUrl').value = SUPABASE_URL;
      document.getElementById('cfgKey').value = SUPABASE_ANON_KEY;
      renderSubjectManager();
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      const u = document.getElementById('cfgUrl').value.trim();
      const k = document.getElementById('cfgKey').value.trim();
      localStorage.setItem('cfg_sp_url', u);
      localStorage.setItem('cfg_sp_key', k);
      SUPABASE_URL = u;
      SUPABASE_ANON_KEY = k;
      closeSettings();
      showToast('設定を保存しました');
      initSupabase();
    }

    // トースト通知機能
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let bg = 'bg-slate-800 text-white';
      if (type === 'warning') bg = 'bg-amber-600 text-white';
      if (type === 'error') bg = 'bg-rose-600 text-white';

      toast.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold transition-all duration-300 transform translate-y-2 opacity-0 flex items-center space-x-2 ${bg}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // スタイルユーティリティ
    function getBadgeStyle(type) {
      if (type === '小テスト') return 'bg-amber-100 text-amber-800 border border-amber-200';
      if (type === '授業変更') return 'bg-slate-200 text-slate-800 border border-slate-300';
      if (type === '提出物') return 'bg-rose-100 text-rose-800 border border-rose-200';
      return 'bg-slate-100 text-slate-700';
    }

    function getTypeIcon(type) {
      if (type === '小テスト') return '📝';
      if (type === '授業変更') return '🔄';
      if (type === '提出物') return '📤';
      return '📅';
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDate(str) {
      if (!str) return '';
      const [y, m, d] = str.split('-');
      const date = new Date(y, m - 1, d);
      const dayStr = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
      return `${parseInt(m)}/${parseInt(d)}(${dayStr})`;
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
