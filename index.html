<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>授業変更・小テスト・提出物管理</title>

  <!-- PWA & Theme Colors -->
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="授業・課題">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e293b'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%232a9d8f'>📚</text></svg>">
  <link rel="manifest" id="manifest-placeholder">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              750: '#115e59',
              850: '#0f4c47',
              900: '#134e4a',
              950: '#042f2e',
            },
            sage: {
              50: '#f4f7f5',
              100: '#e3ebe6',
              200: '#c7d7ce',
              500: '#52796f',
              600: '#354f52',
              700: '#2f3e46',
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #f1f5f9;
    }
    input, textarea, select {
      user-select: auto;
    }
    /* スクロールバーのカスタマイズ */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body class="text-slate-700 antialiased min-h-screen pb-24 bg-slate-100 flex flex-col">

  <!-- ヘッダー (マルチデバイス対応) -->
  <header class="bg-slate-800 text-slate-100 shadow-md sticky top-0 z-20 border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-teal-600/30 border border-teal-500/30 flex items-center justify-center text-teal-300 text-lg">
          <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <div>
          <h1 class="font-bold text-base md:text-lg leading-tight tracking-wide text-slate-100">授業変更・課題ノート</h1>
          <p class="text-[10px] md:text-xs text-slate-400 font-medium">小テスト・授業変更・提出物</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- ビュー切り替えボタン -->
        <div class="bg-slate-900/80 p-1 rounded-xl flex text-xs border border-slate-700">
          <button id="viewListBtn" onclick="toggleView('list')" class="px-3 py-1.5 rounded-lg bg-teal-700 text-white font-bold shadow-xs transition-all">
            <i class="fa-solid fa-list-ul sm:mr-1"></i><span class="hidden sm:inline">リスト</span>
          </button>
          <button id="viewCalBtn" onclick="toggleView('calendar')" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white font-medium transition-all">
            <i class="fa-regular fa-calendar-days sm:mr-1"></i><span class="hidden sm:inline">カレンダー</span>
          </button>
          <button id="viewBothBtn" onclick="toggleView('both')" class="hidden md:block px-3 py-1.5 rounded-lg text-slate-300 hover:text-white font-medium transition-all">
            <i class="fa-solid fa-columns sm:mr-1"></i><span>両方</span>
          </button>
        </div>

        <!-- 設定ボタン -->
        <button onclick="openSettings()" class="text-slate-300 hover:text-white bg-slate-700/60 hover:bg-slate-700 p-2 sm:px-3 sm:py-2 rounded-xl transition-colors flex items-center space-x-1.5">
          <i class="fa-solid fa-gear text-sm"></i>
          <span class="hidden sm:inline text-xs font-bold">教科設定</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl mx-auto px-4 pt-4 sm:pt-6 flex-1 w-full">

    <!-- 絞り込みタブ & アクション -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
      <div class="grid grid-cols-4 bg-white p-1 rounded-2xl shadow-xs border border-slate-200/80 text-xs font-bold text-slate-500 gap-1 w-full sm:w-auto sm:min-w-[380px]">
        <button id="tab-all" onclick="setFilter('all')" class="py-2 px-3 rounded-xl bg-teal-700 text-white transition-all shadow-xs">すべて</button>
        <button id="tab-quiz" onclick="setFilter('小テスト')" class="py-2 px-3 rounded-xl hover:text-slate-800 transition-all">小テスト</button>
        <button id="tab-change" onclick="setFilter('授業変更')" class="py-2 px-3 rounded-xl hover:text-slate-800 transition-all">授業変更</button>
        <button id="tab-task" onclick="setFilter('提出物')" class="py-2 px-3 rounded-xl hover:text-slate-800 transition-all">提出物</button>
      </div>

      <!-- PC用 新規作成ボタン -->
      <button onclick="openModal()" class="hidden sm:flex items-center justify-center space-x-2 bg-teal-700 hover:bg-teal-800 text-white px-5 py-2.5 rounded-2xl font-bold text-xs shadow-sm transition-all active:scale-[0.98]">
        <i class="fa-solid fa-plus text-sm"></i>
        <span>新しい予定を追加</span>
      </button>
    </div>

    <!-- ステータスバナー -->
    <div id="statusBanner" class="hidden mb-4 p-2.5 text-xs rounded-xl flex justify-between items-center border">
      <span id="statusText">接続確認中...</span>
      <button onclick="initSupabase()" class="font-bold underline">再接続</button>
    </div>

    <!-- レスポンシブ メインレイアウトグリッド -->
    <div id="mainGrid" class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">

      <!-- 1. リスト表示エリア -->
      <div id="listView" class="md:col-span-12 space-y-3 transition-all duration-300">
        <div id="scheduleList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
        <div id="emptyList" class="hidden py-16 text-center text-slate-400 bg-white rounded-2xl border border-slate-200/60 p-6 shadow-xs">
          <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
          <p class="text-xs font-bold text-slate-500">該当する予定はありません</p>
          <p class="text-[11px] text-slate-400 mt-1">「＋」ボタンから追加できます</p>
        </div>
      </div>

      <!-- 2. カレンダー表示エリア -->
      <div id="calendarView" class="hidden md:col-span-12 bg-white rounded-2xl p-4 sm:p-6 shadow-xs border border-slate-200/80 transition-all duration-300">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
          <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors">
            <i class="fa-solid fa-chevron-left text-xs"></i>
          </button>
          <h2 id="calMonthTitle" class="font-bold text-sm sm:text-base text-slate-800 tracking-wide"></h2>
          <button onclick="changeMonth(1)" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors">
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
        </div>

        <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-[11px] sm:text-xs font-bold text-slate-400 mb-1">
          <span class="text-rose-400">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-teal-600">土</span>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2"></div>
      </div>

    </div>

  </main>

  <!-- スマホ用 FAB (画面右下) -->
  <button onclick="openModal()" class="sm:hidden fixed bottom-6 right-6 w-14 h-14 bg-teal-700 hover:bg-teal-800 text-white rounded-2xl shadow-lg flex items-center justify-center text-xl transition-all active:scale-95 z-30 border border-teal-600/30">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- 日別予定一覧モーダル (カレンダーセル選択時に表示) -->
  <div id="dayScheduleModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4 transition-opacity">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-5 sm:p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col border border-slate-200">
      
      <!-- モーダルヘッダー -->
      <div class="flex justify-between items-center border-b border-slate-100 pb-3 shrink-0">
        <div class="flex items-center space-x-2">
          <div class="w-2.5 h-5 bg-teal-700 rounded-full"></div>
          <h3 id="dayModalTitle" class="font-bold text-slate-800 text-base sm:text-lg">○月○日(曜日)の予定</h3>
        </div>
        <button onclick="closeDayModal()" class="w-8 h-8 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl flex items-center justify-center transition-colors">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- 予定一覧コンテナ (スクロール可能) -->
      <div id="dayScheduleList" class="space-y-3 overflow-y-auto flex-1 pr-1">
        <!-- JSで動的生成 -->
      </div>

      <!-- アクションフッター -->
      <div class="pt-2 border-t border-slate-100 shrink-0">
        <button onclick="addNewFromDayModal()" class="w-full py-3 bg-teal-700 hover:bg-teal-800 text-white font-bold text-xs sm:text-sm rounded-xl shadow-xs transition-all active:scale-[0.99] flex items-center justify-center space-x-2">
          <i class="fa-solid fa-plus"></i>
          <span>この日に予定を追加する</span>
        </button>
      </div>

    </div>
  </div>

  <!-- 登録・編集モーダル -->
  <div id="formModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4 transition-opacity">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 sm:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto border border-slate-200">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <div class="flex items-center space-x-2">
          <div class="w-2 h-4 bg-teal-600 rounded-full"></div>
          <h3 id="modalTitle" class="font-bold text-slate-800 text-base">予定を追加</h3>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl flex items-center justify-center transition-colors">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="scheduleForm" onsubmit="saveSchedule(event)" class="space-y-4">
        <input type="hidden" id="editId" value="">

        <!-- タイプ選択 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">タイプ</label>
          <div class="grid grid-cols-3 gap-2 text-xs font-bold">
            <label class="cursor-pointer">
              <input type="radio" name="formType" value="小テスト" checked onchange="toggleTypeUI()" class="peer sr-only">
              <div class="py-2.5 px-1 text-center rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-amber-50 peer-checked:border-amber-400 peer-checked:text-amber-800 transition-all flex flex-col items-center justify-center space-y-1">
                <span>📝 小テスト</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="formType" value="授業変更" onchange="toggleTypeUI()" class="peer sr-only">
              <div class="py-2.5 px-1 text-center rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-teal-50 peer-checked:border-teal-500 peer-checked:text-teal-800 transition-all flex flex-col items-center justify-center space-y-1">
                <span>🔄 授業変更</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="formType" value="提出物" onchange="toggleTypeUI()" class="peer sr-only">
              <div class="py-2.5 px-1 text-center rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-rose-50 peer-checked:border-rose-400 peer-checked:text-rose-800 transition-all flex flex-col items-center justify-center space-y-1">
                <span>📤 提出物</span>
              </div>
            </label>
          </div>
        </div>

        <!-- 日付 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">日付 / 提出期限</label>
          <input type="date" id="formDate" required class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-600/30 focus:border-teal-600 bg-slate-50">
        </div>

        <!-- 単一教科選択 (小テスト / 提出物用) -->
        <div id="singleSubjectArea">
          <label class="block text-xs font-bold text-slate-600 mb-1">科目名</label>
          <select id="formSubject" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-600/30 focus:border-teal-600"></select>
        </div>

        <!-- 授業変更用 教科選択 -->
        <div id="doubleSubjectArea" class="hidden">
          <label class="block text-xs font-bold text-slate-600 mb-1">教科の変更</label>
          <div class="flex items-center space-x-2">
            <div class="flex-1">
              <span class="text-[10px] text-slate-400 block mb-0.5">変更前</span>
              <select id="formSubjectFrom" class="w-full px-2.5 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-600/30 focus:border-teal-600"></select>
            </div>
            <i class="fa-solid fa-arrow-right text-slate-400 mt-4 text-xs"></i>
            <div class="flex-1">
              <span class="text-[10px] text-slate-400 block mb-0.5">変更後</span>
              <select id="formSubjectTo" class="w-full px-2.5 py-2 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-600/30 focus:border-teal-600"></select>
            </div>
          </div>
        </div>

        <!-- 内容 -->
        <div>
          <label id="contentLabel" class="block text-xs font-bold text-slate-600 mb-1">内容 / 範囲</label>
          <textarea id="formContent" rows="3" required placeholder="例: P.10〜15の単語テスト / ワークブック提出" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-600/30 focus:border-teal-600"></textarea>
        </div>

        <!-- 登録者名 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">登録者名</label>
          <input type="text" id="formAuthor" required placeholder="例: 山田" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-600/30 focus:border-teal-600">
        </div>

        <button type="submit" class="w-full py-3 bg-teal-700 hover:bg-teal-800 text-white font-bold text-sm rounded-xl shadow-md transition-all active:scale-[0.99] mt-2">
          保存する
        </button>
      </form>
    </div>
  </div>

  <!-- 設定モーダル (並び替え & 追加・削除対応) -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 sm:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto border border-slate-200">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
        <h3 class="font-bold text-slate-800 text-sm sm:text-base">アプリ設定 & 教科管理</h3>
        <button onclick="closeSettings()" class="w-8 h-8 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- 教科の並び替え & 管理セクション -->
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <label class="block text-xs font-bold text-slate-700">📚 選択教科の管理・順序変更</label>
          <button type="button" onclick="resetSubjectsToDefault()" class="text-[10px] text-teal-700 hover:underline font-bold">
            初期状態に戻す
          </button>
        </div>
        <p class="text-[11px] text-slate-400 leading-tight">▲▼ボタンで教科の並び順を変更できます。順序は選択フォームにすぐ反映されます。</p>
        
        <!-- 並び替え対応リスト -->
        <div id="subjectReorderList" class="space-y-1.5 p-2 bg-slate-50 border border-slate-200/80 rounded-xl max-h-56 overflow-y-auto">
          <!-- JSで動的描画 -->
        </div>

        <!-- 教科追加フォーム -->
        <div class="flex space-x-1.5 pt-1">
          <input type="text" id="newSubjectInput" placeholder="新しい教科名を入力" class="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-teal-600/30 focus:border-teal-600">
          <button type="button" onclick="addSubject()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition-colors">
            追加
          </button>
        </div>
      </div>

      <hr class="border-slate-100">

      <!-- Supabase設定セクション -->
      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-700">⚡ Supabase データベース連携</label>
        <div>
          <label class="block text-[10px] text-slate-500 mb-0.5">Project URL</label>
          <input type="text" id="cfgUrl" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs font-mono bg-slate-50 focus:outline-none focus:border-teal-600">
        </div>
        <div>
          <label class="block text-[10px] text-slate-500 mb-0.5">Anon Key</label>
          <input type="password" id="cfgKey" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs font-mono bg-slate-50 focus:outline-none focus:border-teal-600">
        </div>
      </div>

      <button onclick="saveSettings()" class="w-full py-2.5 bg-teal-700 hover:bg-teal-800 text-white font-bold text-xs rounded-xl shadow-xs transition-colors">
        設定を保存して閉じる
      </button>
    </div>
  </div>

  <!-- カスタム確認モーダル -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl space-y-4 text-center border border-slate-200">
      <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-trash-can"></i>
      </div>
      <div>
        <h4 class="font-bold text-slate-800 text-sm">予定の削除</h4>
        <p class="text-xs text-slate-500 mt-1">この予定を削除してもよろしいですか？</p>
      </div>
      <div class="flex space-x-2">
        <button onclick="closeConfirmModal(false)" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-colors">
          キャンセル
        </button>
        <button id="confirmExecuteBtn" onclick="closeConfirmModal(true)" class="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl transition-colors">
          削除する
        </button>
      </div>
    </div>
  </div>

  <!-- カスタムトースト通知 -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2">
    <div id="toastContent" class="bg-slate-800 text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold flex items-center space-x-2 border border-slate-700">
      <i id="toastIcon" class="fa-solid fa-circle-info text-teal-400"></i>
      <span id="toastMessage">メッセージ</span>
    </div>
  </div>

  <script>
    // デフォルト教科リスト
    const DEFAULT_SUBJECTS = [
      '論理国語', '古典探究', '数学', '英コミュ', '論理表現',
      '物理', '生物', '化学', '公共', '情報II', '家庭科', '保健', '体育'
    ];

    let subjects = JSON.parse(localStorage.getItem('cfg_subjects')) || DEFAULT_SUBJECTS;

    let SUPABASE_URL = localStorage.getItem('cfg_sp_url') || '';
    let SUPABASE_ANON_KEY = localStorage.getItem('cfg_sp_key') || '';
    let supabaseClient = null;

    let schedules = [];
    let activeFilter = 'all';
    let currentViewMode = 'list';
    let calDate = new Date();
    let pendingDeleteId = null;
    let selectedDayDateStr = ''; // 現在日別モーダルで選択している日付

    // Dynamic Manifest
    const manifest = {
      "name": "授業変更・小テスト・提出物管理",
      "short_name": "授業・課題",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#1e293b",
      "theme_color": "#1e293b",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e293b'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%232a9d8f'>📚</text></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    document.getElementById('manifest-placeholder').setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));

    window.addEventListener('DOMContentLoaded', () => {
      initDropdowns();
      initSupabase();
    });

    function initDropdowns() {
      const opts = subjects.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      document.getElementById('formSubject').innerHTML = opts;
      document.getElementById('formSubjectFrom').innerHTML = opts;
      document.getElementById('formSubjectTo').innerHTML = opts;
    }

    // トースト表示
    function showToast(message, icon = 'fa-circle-info', colorClass = 'text-teal-400') {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toastMessage');
      const iconEl = document.getElementById('toastIcon');

      msgEl.textContent = message;
      iconEl.className = `fa-solid ${icon} ${colorClass}`;

      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 3000);
    }

    // 教科マネージャー
    function renderSubjectManager() {
      const container = document.getElementById('subjectReorderList');
      container.innerHTML = '';

      subjects.forEach((sub, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2 bg-white border border-slate-200/80 rounded-xl text-xs font-medium text-slate-700 shadow-2xs';
        
        const isFirst = (idx === 0);
        const isLast = (idx === subjects.length - 1);

        item.innerHTML = `
          <div class="flex items-center space-x-2 truncate pr-2">
            <span class="w-5 text-[10px] text-slate-400 font-bold text-center">${idx + 1}</span>
            <span class="truncate font-bold text-slate-800">${escapeHtml(sub)}</span>
          </div>
          <div class="flex items-center space-x-1 shrink-0">
            <button type="button" onclick="moveSubject(${idx}, -1)" ${isFirst ? 'disabled class="w-6 h-6 text-slate-200 cursor-not-allowed"' : 'class="w-6 h-6 text-slate-500 hover:text-teal-700 hover:bg-slate-100 rounded-md flex items-center justify-center transition-colors"'}>
              <i class="fa-solid fa-chevron-up text-[10px]"></i>
            </button>
            <button type="button" onclick="moveSubject(${idx}, 1)" ${isLast ? 'disabled class="w-6 h-6 text-slate-200 cursor-not-allowed"' : 'class="w-6 h-6 text-slate-500 hover:text-teal-700 hover:bg-slate-100 rounded-md flex items-center justify-center transition-colors"'}>
              <i class="fa-solid fa-chevron-down text-[10px]"></i>
            </button>
            <button type="button" onclick="removeSubject(${idx})" class="w-6 h-6 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-md flex items-center justify-center transition-colors ml-1">
              <i class="fa-solid fa-xmark text-xs"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function moveSubject(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= subjects.length) return;

      const temp = subjects[index];
      subjects[index] = subjects[newIndex];
      subjects[newIndex] = temp;

      saveSubjectsToStorage();
    }

    function addSubject() {
      const input = document.getElementById('newSubjectInput');
      const name = input.value.trim();
      if (!name) return;

      if (subjects.includes(name)) {
        showToast('その教科はすでに追加されています', 'fa-circle-exclamation', 'text-amber-400');
        return;
      }

      subjects.push(name);
      saveSubjectsToStorage();
      input.value = '';
      showToast('教科を追加しました', 'fa-circle-check', 'text-emerald-400');
    }

    function removeSubject(index) {
      if (subjects.length <= 1) {
        showToast('教科は最低1つ必要です', 'fa-circle-exclamation', 'text-amber-400');
        return;
      }
      subjects.splice(index, 1);
      saveSubjectsToStorage();
      showToast('教科を削除しました', 'fa-circle-check', 'text-emerald-400');
    }

    function resetSubjectsToDefault() {
      subjects = [...DEFAULT_SUBJECTS];
      saveSubjectsToStorage();
      showToast('教科をデフォルト順に復元しました', 'fa-circle-check', 'text-teal-400');
    }

    function saveSubjectsToStorage() {
      localStorage.setItem('cfg_subjects', JSON.stringify(subjects));
      renderSubjectManager();
      initDropdowns();
    }

    function initSupabase() {
      const banner = document.getElementById('statusBanner');
      const text = document.getElementById('statusText');

      if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          banner.className = 'mb-4 p-2.5 text-xs rounded-xl flex justify-between items-center bg-teal-50 text-teal-800 border border-teal-200/80';
          text.innerHTML = '<i class="fa-solid fa-cloud-check mr-1 text-teal-600"></i> Supabase クラウド同期中';
          loadSchedules();
          return;
        } catch(e) { console.error(e); }
      }

      banner.className = 'mb-4 p-2.5 text-xs rounded-xl flex justify-between items-center bg-slate-200/60 text-slate-700 border border-slate-300/60';
      text.innerHTML = '<i class="fa-solid fa-hard-drive mr-1 text-slate-500"></i> ローカルモード (端末内保存)';
      loadLocalSchedules();
    }

    async function loadSchedules() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('schedule_items')
          .select('*')
          .order('date', { ascending: true });
        if (error) throw error;
        schedules = data || [];
        render();
      } catch (err) {
        console.error(err);
        loadLocalSchedules();
      }
    }

    function loadLocalSchedules() {
      const local = localStorage.getItem('demo_data');
      if (local) {
        schedules = JSON.parse(local);
      } else {
        schedules = [
          { id: '1', date: getTodayStr(), type: '小テスト', subject: '英コミュ', content: 'Lesson 4 単語テスト (p.24-25)', author: '係' },
          { id: '2', date: getTodayStr(), type: '授業変更', subject: '数学 → 物理', content: '体育館行事のため時間割変更', author: '担任' },
          { id: '3', date: getTodayStr(), type: '提出物', subject: '論理国語', content: 'ワークブック 第2章 まとめノート提出', author: '国語担当' }
        ];
        saveLocalSchedules();
      }
      render();
    }

    function saveLocalSchedules() {
      localStorage.setItem('demo_data', JSON.stringify(schedules));
    }

    async function saveSchedule(e) {
      e.preventDefault();

      const editId = document.getElementById('editId').value;
      const type = document.querySelector('input[name="formType"]:checked').value;
      const date = document.getElementById('formDate').value;
      const content = document.getElementById('formContent').value.trim();
      const author = document.getElementById('formAuthor').value.trim();

      let subject = '';
      if (type === '授業変更') {
        const from = document.getElementById('formSubjectFrom').value;
        const to = document.getElementById('formSubjectTo').value;
        subject = `${from} → ${to}`;
      } else {
        // 小テストおよび提出物は単一科目から取得
        subject = document.getElementById('formSubject').value;
      }

      const item = { date, type, subject, content, author };

      if (supabaseClient) {
        try {
          if (editId) {
            const { error } = await supabaseClient.from('schedule_items').update(item).eq('id', editId);
            if (error) throw error;
          } else {
            const { error } = await supabaseClient.from('schedule_items').insert([item]);
            if (error) throw error;
          }
          showToast('保存しました', 'fa-circle-check', 'text-teal-400');
          loadSchedules();
        } catch (err) {
          console.error('Supabase Save Error:', err);
          let userMsg = '保存失敗: ' + (err.message || 'エラーが発生しました');
          if (err.message && (err.message.includes('check constraint') || err.message.includes('violates check constraint') || err.code === '23514')) {
            userMsg = 'Supabase DBのCHECK制約エラー: type列に「提出物」を許可するDB設定変更が必要です';
          }
          showToast(userMsg, 'fa-triangle-exclamation', 'text-rose-400');
        }
      } else {
        if (editId) {
          schedules = schedules.map(s => s.id === editId ? { ...s, ...item } : s);
        } else {
          item.id = Date.now().toString();
          schedules.push(item);
        }
        saveLocalSchedules();
        showToast('保存しました', 'fa-circle-check', 'text-teal-400');
        render();
      }

      closeModal();
      // もし日別予定モーダルが開いていれば更新
      if (!document.getElementById('dayScheduleModal').classList.contains('hidden') && selectedDayDateStr) {
        openDayModal(selectedDayDateStr);
      }
    }

    function deleteItem(id) {
      pendingDeleteId = id;
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    async function closeConfirmModal(confirmed) {
      document.getElementById('confirmModal').classList.add('hidden');
      if (!confirmed || !pendingDeleteId) return;

      const id = pendingDeleteId;
      pendingDeleteId = null;

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.from('schedule_items').delete().eq('id', id);
          if (error) throw error;
          showToast('削除しました', 'fa-circle-check', 'text-teal-400');
          loadSchedules();
        } catch (err) {
          showToast('削除エラー: ' + err.message, 'fa-triangle-exclamation', 'text-rose-400');
        }
      } else {
        schedules = schedules.filter(s => s.id !== id);
        saveLocalSchedules();
        showToast('削除しました', 'fa-circle-check', 'text-teal-400');
        render();
      }

      // 日別モーダルが開いていれば再読み込み
      if (!document.getElementById('dayScheduleModal').classList.contains('hidden') && selectedDayDateStr) {
        openDayModal(selectedDayDateStr);
      }
    }

    function openEditModal(id) {
      const item = schedules.find(s => s.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('modalTitle').textContent = '予定を編集';
      document.getElementById('formDate').value = item.date;
      document.getElementById('formContent').value = item.content;
      document.getElementById('formAuthor').value = item.author;

      const radios = document.getElementsByName('formType');
      for (let r of radios) r.checked = (r.value === item.type);
      toggleTypeUI();

      if (item.type === '授業変更') {
        if (item.subject.includes('→')) {
          const parts = item.subject.split('→').map(s => s.trim());
          document.getElementById('formSubjectFrom').value = parts[0] || subjects[0];
          document.getElementById('formSubjectTo').value = parts[1] || subjects[0];
        }
      } else {
        // 小テスト・提出物の場合
        const subjectSelect = document.getElementById('formSubject');
        if (subjects.includes(item.subject)) {
          subjectSelect.value = item.subject;
        } else if (subjectSelect.options.length > 0) {
          subjectSelect.value = subjectSelect.options[0].value;
        }
      }

      document.getElementById('formModal').classList.remove('hidden');
    }

    // 日別予定一覧モーダルの表示 logic

      selectedDayDateStr = dateStr;
      const modal = document.getElementById('dayScheduleModal');
      const titleEl = document.getElementById('dayModalTitle');
      const listEl = document.getElementById('dayScheduleList');

      titleEl.textContent = `${formatDateFull(dateStr)} の予定`;
      listEl.innerHTML = '';

      // その日のすべての予定を抽出 (制限なく全件)

          <div class="py-12 text-center text-slate-400 bg-slate-50/80 rounded-2xl border border-dashed border-slate-200 p-6">
            <i class="fa-regular fa-calendar-xmark text-3xl mb-2 text-slate-300"></i>
            <p class="text-xs font-bold text-slate-500">この日の予定はありません</p>
            <p class="text-[11px] text-slate-400 mt-0.5">「＋ この日に予定を追加」から登録できます</p>
          </div>
        `;
      } else {
        dayItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-2xs space-y-2 hover:border-slate-300 transition-colors';
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div>
                ${getTypeBadge(item.type)}
              </div>
              <div class="flex items-center space-x-1">
                <button onclick="openEditModal('${item.id}')" class="w-7 h-7 rounded-lg text-slate-400 hover:text-teal-700 hover:bg-slate-100 flex items-center justify-center text-xs transition-colors" title="編集">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="deleteItem('${item.id}')" class="w-7 h-7 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 flex items-center justify-center text-xs transition-colors" title="削除">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </div>
            <h4 class="font-bold text-slate-800 text-sm tracking-wide">${escapeHtml(item.subject)}</h4>

            <div class="text-right text-[10px] text-slate-400 font-medium pt-1">登録: ${escapeHtml(item.author)}</div>

    function closeDayModal() {
      document.getElementById('dayScheduleModal').classList.add('hidden');
    }

    function addNewFromDayModal() {
      const dateToUse = selectedDayDateStr || getTodayStr();
      closeDayModal();
      openModal(dateToUse);
    }

    function render() {
      renderList();
      renderCalendar();
      if (!document.getElementById('dayScheduleModal').classList.contains('hidden') && selectedDayDateStr) {
        openDayModal(selectedDayDateStr);
      }
    }

    function getTypeBadge(type) {
      if (type === '小テスト') {
        return '<span class="px-2 py-0.5 text-[11px] font-bold rounded-md bg-amber-50 text-amber-800 border border-amber-200/80">📝 小テスト</span>';
      } else if (type === '授業変更') {
        return '<span class="px-2 py-0.5 text-[11px] font-bold rounded-md bg-teal-50 text-teal-800 border border-teal-200/80">🔄 授業変更</span>';
      } else if (type === '提出物') {
        return '<span class="px-2 py-0.5 text-[11px] font-bold rounded-md bg-rose-50 text-rose-800 border border-rose-200/80">📤 提出物</span>';
      }
      return '';
    }

    function renderList() {
      const listEl = document.getElementById('scheduleList');
      const emptyEl = document.getElementById('emptyList');
      listEl.innerHTML = '';

      let list = schedules;
      if (activeFilter !== 'all') {
        list = schedules.filter(s => s.type === activeFilter);
      }

      list.sort((a, b) => new Date(a.date) - new Date(b.date));

      if (list.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 space-y-2 hover:border-slate-300 transition-colors flex flex-col justify-between';
        card.innerHTML = `
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <div class="flex items-center space-x-2">
                ${getTypeBadge(item.type)}
                <span class="text-xs font-bold text-slate-500">${formatDate(item.date)}</span>
              </div>
              <div class="flex items-center space-x-1">
                <button onclick="openEditModal('${item.id}')" class="w-7 h-7 rounded-lg text-slate-400 hover:text-teal-700 hover:bg-slate-100 flex items-center justify-center text-xs transition-colors">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="deleteItem('${item.id}')" class="w-7 h-7 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 flex items-center justify-center text-xs transition-colors">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </div>
            <h3 class="font-bold text-slate-800 text-sm tracking-wide">${escapeHtml(item.subject)}</h3>
            <p class="text-xs text-slate-600 bg-slate-50/80 border border-slate-100 p-2.5 rounded-xl whitespace-pre-wrap leading-relaxed">${escapeHtml(item.content)}</p>
          </div>
          <div class="text-right text-[10px] text-slate-400 font-medium pt-2 border-t border-slate-50 mt-2">登録: ${escapeHtml(item.author)}</div>
        `;
        listEl.appendChild(card);
      });
    }

    function renderCalendar() {
      const year = calDate.getFullYear();
      const month = calDate.getMonth();

      document.getElementById('calMonthTitle').textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevTotalDays = new Date(year, month, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const todayStr = getTodayStr();

      // 前月補填
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = prevTotalDays - i;
        grid.appendChild(createCalCell(d, true));
      }

      // 当月
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        let items = schedules.filter(s => s.date === dateStr);
        if (activeFilter !== 'all') items = items.filter(s => s.type === activeFilter);

        grid.appendChild(createCalCell(day, false, dateStr === todayStr, items, dateStr));
      }

      // 翌月補填
      const pad = 35 - grid.children.length;
      for (let i = 1; i <= pad; i++) {
        grid.appendChild(createCalCell(i, true));
      }
    }

    function createCalCell(day, isOther, isToday = false, items = [], dateStr = '') {
      const cell = document.createElement('div');
      cell.className = `min-h-[68px] sm:min-h-[84px] p-1 sm:p-1.5 border rounded-xl flex flex-col justify-between text-xs transition-all ${
        isOther ? 'bg-slate-50/50 text-slate-300 border-slate-100' : 'bg-white text-slate-700 border-slate-200/70 cursor-pointer hover:border-teal-500 hover:shadow-xs'
      } ${isToday ? 'ring-2 ring-teal-600 bg-teal-50/20' : ''}`;

      if (!isOther) {
        // カレンダーセルタップ時は「日別予定一覧モーダル」を起動
        cell.onclick = () => openDayModal(dateStr);
      }

      let badgeHtml = '';
      if (items.length > 0) {
        badgeHtml = '<div class="space-y-0.5 sm:space-y-1 mt-0.5">';
        items.slice(0, 2).forEach(it => {
          let bg = 'bg-slate-100 text-slate-700';
          if (it.type === '小テスト') bg = 'bg-amber-100/90 text-amber-900';
          if (it.type === '授業変更') bg = 'bg-teal-100/90 text-teal-900';
          if (it.type === '提出物') bg = 'bg-rose-100/90 text-rose-900';

          badgeHtml += `<div class="text-[8px] sm:text-[10px] px-1 py-0.5 rounded-md font-bold truncate ${bg}">${escapeHtml(it.subject)}</div>`;
        });
        if (items.length > 2) badgeHtml += `<div class="text-[8px] text-teal-700 font-bold text-center bg-teal-50 rounded-md py-0.5">+${items.length - 2}件</div>`;
        badgeHtml += '</div>';
      }

      cell.innerHTML = `
        <div class="font-bold text-[10px] sm:text-xs flex justify-between items-center">
          <span class="${isToday ? 'text-teal-700 font-black' : ''}">${day}</span>
        </div>
        ${badgeHtml}
      `;
      return cell;
    }

    function changeMonth(dir) {
      calDate.setMonth(calDate.getMonth() + dir);
      renderCalendar();
    }

    function toggleView(mode) {
      currentViewMode = mode;
      const listBtn = document.getElementById('viewListBtn');
      const calBtn = document.getElementById('viewCalBtn');
      const bothBtn = document.getElementById('viewBothBtn');

      const listView = document.getElementById('listView');
      const calView = document.getElementById('calendarView');

      listBtn.className = 'px-3 py-1.5 rounded-lg text-slate-300 hover:text-white font-medium transition-all';
      calBtn.className = 'px-3 py-1.5 rounded-lg text-slate-300 hover:text-white font-medium transition-all';
      bothBtn.className = 'px-3 py-1.5 rounded-lg text-slate-300 hover:text-white font-medium transition-all hidden md:block';

      if (mode === 'list') {
        listBtn.className = 'px-3 py-1.5 rounded-lg bg-teal-700 text-white font-bold shadow-xs transition-all';
        listView.className = 'md:col-span-12 space-y-3';
        calView.classList.add('hidden');
        listView.classList.remove('hidden');
      } else if (mode === 'calendar') {
        calBtn.className = 'px-3 py-1.5 rounded-lg bg-teal-700 text-white font-bold shadow-xs transition-all';
        calView.className = 'md:col-span-12 bg-white rounded-2xl p-4 sm:p-6 shadow-xs border border-slate-200/80';
        listView.classList.add('hidden');
        calView.classList.remove('hidden');
        renderCalendar();
      } else if (mode === 'both') {
        bothBtn.className = 'px-3 py-1.5 rounded-lg bg-teal-700 text-white font-bold shadow-xs transition-all block';
        listView.className = 'md:col-span-5 space-y-3';
        calView.className = 'md:col-span-7 bg-white rounded-2xl p-4 sm:p-6 shadow-xs border border-slate-200/80';
        listView.classList.remove('hidden');
        calView.classList.remove('hidden');
        renderCalendar();
      }
    }

    function setFilter(filter) {
      activeFilter = filter;
      const filterKeys = [
        { id: 'tab-all', val: 'all' },
        { id: 'tab-quiz', val: '小テスト' },
        { id: 'tab-change', val: '授業変更' },
        { id: 'tab-task', val: '提出物' }
      ];

      filterKeys.forEach(item => {
        const btn = document.getElementById(item.id);
        if (filter === item.val) {
          btn.className = 'py-2 px-3 rounded-xl bg-teal-700 text-white transition-all shadow-xs';
        } else {
          btn.className = 'py-2 px-3 rounded-xl text-slate-500 hover:text-slate-800 transition-all';
        }
      });
      render();
    }

    function toggleTypeUI() {
      const type = document.querySelector('input[name="formType"]:checked').value;
      const singleArea = document.getElementById('singleSubjectArea');
      const doubleArea = document.getElementById('doubleSubjectArea');
      const label = document.getElementById('contentLabel');

      if (type === '授業変更') {
        singleArea.classList.add('hidden');
        doubleArea.classList.remove('hidden');
        label.textContent = '理由 / 備考';
      } else if (type === '提出物') {
        singleArea.classList.remove('hidden');
        doubleArea.classList.add('hidden');
        label.textContent = '提出範囲 / 詳細内容';
      } else {
        singleArea.classList.remove('hidden');
        doubleArea.classList.add('hidden');
        label.textContent = '内容 / 範囲';
      }
    }

    function openModal(presetDate = '') {
      document.getElementById('editId').value = '';
      document.getElementById('modalTitle').textContent = '予定を追加';
      document.getElementById('scheduleForm').reset();
      document.getElementById('formDate').value = presetDate || getTodayStr();
      toggleTypeUI();
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    function openSettings() {
      document.getElementById('cfgUrl').value = SUPABASE_URL;
      document.getElementById('cfgKey').value = SUPABASE_ANON_KEY;
      renderSubjectManager();
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      const u = document.getElementById('cfgUrl').value.trim();
      const k = document.getElementById('cfgKey').value.trim();
      localStorage.setItem('cfg_sp_url', u);
      localStorage.setItem('cfg_sp_key', k);
      SUPABASE_URL = u;
      SUPABASE_ANON_KEY = k;
      closeSettings();
      initSupabase();
      showToast('設定を更新しました', 'fa-circle-check', 'text-teal-400');
    }

    // ユーティリティ
    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDate(str) {
      if (!str) return '';
      const [y, m, d] = str.split('-');
      const date = new Date(y, m - 1, d);
      const dayStr = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
      return `${parseInt(m)}/${parseInt(d)}(${dayStr})`;
    }

    function formatDateFull(str) {
      if (!str) return '';
      const [y, m, d] = str.split('-');
      const date = new Date(y, m - 1, d);
      const dayStr = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
      return `${parseInt(m)}月${parseInt(d)}日(${dayStr})`;
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
</html>
